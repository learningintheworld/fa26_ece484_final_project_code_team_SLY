# These are conservative simulator starting values, not physical vehicle limits.
sly_sim_controller:
  ros__parameters:
    use_sim_time: true
    simulation_only: true
    local_frame: base_link
    wheelbase_m: 1.75
    lookahead_m: 2.0
    max_steering_rad: 0.45
    cruise_speed_mps: 1.0
    max_lateral_accel_mps2: 0.4
    minimum_target_distance_m: 0.2
    max_accel_mps2: 0.3
    input_timeout_s: 0.5
    future_stamp_tolerance_s: 0.05
    standstill_speed_mps: 0.05
    sign_dwell_s: 3.0
    sign_clear_rearm_s: 2.0
